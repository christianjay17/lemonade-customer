<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemonade Stand — Order Lookup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fffbf2; min-height: 100vh; }
  .header { background: #EF9F27; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 12px; }
  .header-emoji { font-size: 26px; }
  .header-title { font-size: 19px; font-weight: 600; color: #412402; }
  .header-sub { font-size: 12px; color: #633806; }
  .container { max-width: 480px; margin: 0.875rem auto; padding: 0 0.75rem 2rem; }
  .card { background: #fff; border: 1px solid #e8e0d0; border-radius: 12px; padding: 1rem; margin-bottom: 0.875rem; }
  .section-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .code-input { width: 100%; height: 68px; border-radius: 10px; border: 1px solid #e8e0d0; background: #fff; color: #1a1a1a; text-align: center; font-size: clamp(28px, 10vw, 36px); font-weight: 700; letter-spacing: 0.25em; font-family: 'Courier New', monospace; padding: 0 12px; margin-bottom: 12px; -webkit-appearance: none; }
  .code-input:focus { outline: none; border-color: #EF9F27; box-shadow: 0 0 0 3px rgba(239,159,39,0.15); }
  .lookup-btn { width: 100%; padding: 15px; border-radius: 8px; border: none; background: #EF9F27; color: #412402; font-size: 16px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .lookup-btn:active { background: #FAC775; }
  .lookup-btn:disabled { opacity: 0.4; }
  .error-msg { font-size: 14px; color: #c0392b; margin-top: 10px; text-align: center; display: none; }
  .order-row { display: flex; justify-content: space-between; font-size: 15px; color: #444; padding: 7px 0; border-bottom: 1px solid #f0ebe0; }
  .order-row:last-of-type { border-bottom: none; }
  .order-total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; color: #1a1a1a; padding-top: 10px; margin-top: 6px; border-top: 1px solid #e8e0d0; }
  .payment-banner { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 8px; margin-top: 12px; font-size: 14px; font-weight: 500; }
  .banner-cash { background: #EAF3DE; color: #3B6D11; }
  .banner-venmo { background: #E6F1FB; color: #185FA5; }
  .banner-apple { background: #f0f0f0; color: #1a1a1a; }
  .pay-btn { width: 100%; padding: 15px; border-radius: 8px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; -webkit-tap-highlight-color: transparent; }
  .pay-btn-venmo { background: #3D95CE; color: #fff; }
  .pay-btn-venmo:active { background: #2d7aad; }
  .pay-btn-apple { background: #000; color: #fff; }
  .pay-btn-apple:active { background: #333; }
  .success-box { text-align: center; padding: 2rem 1rem; }
  .success-big { font-size: 52px; margin-bottom: 12px; }
  .success-box h2 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .success-box p { font-size: 15px; color: #666; line-height: 1.5; }
  .another-btn { margin-top: 1.5rem; padding: 12px 28px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 15px; color: #333; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .another-btn:active { background: #f5f5f5; }
  #orderView, #successView { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-emoji">🍋</div>
  <div>
    <div class="header-title">C&N Lemonade</div>
    <div class="header-sub">Order Lookup</div>
  </div>
</div>

<div class="container">
  <div id="lookupView">
    <div class="card">
      <p class="section-label">Enter your order code</p>
      <input class="code-input" id="codeInput" type="text" placeholder="A1B2" maxlength="4" autocomplete="off" autocapitalize="characters" oninput="this.value=this.value.toUpperCase()">
      <button class="lookup-btn" id="lookupBtn" onclick="lookupCode()">Look up order</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <div id="orderView">
    <div class="card">
      <p class="section-label">Your order</p>
      <div id="orderLines"></div>
      <div class="order-total-row">
        <span>Total</span>
        <span id="orderTotal"></span>
      </div>
      <div class="payment-banner" id="paymentBanner"></div>
      <div id="payBtnWrap"></div>
    </div>
  </div>

  <div id="successView">
    <div class="card">
      <div class="success-box">
        <div class="success-big" id="successEmoji">🍋</div>
        <h2 id="successTitle">All set!</h2>
        <p id="successMsg">Enjoy your lemonade!</p>
        <button class="another-btn" onclick="resetCustomer()">Start over</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBv5S44GU9ESCv-gypE7ujawsz5Je0935U",
  authDomain: "lemonade-10d16.firebaseapp.com",
  projectId: "lemonade-10d16",
  storageBucket: "lemonade-10d16.firebasestorage.app",
  messagingSenderId: "190999159050",
  appId: "1:190999159050:web:894ae02547b1e59fd59af3"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentCode = null;
  let currentOrder = null;

  window.lookupCode = async () => {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    const errEl = document.getElementById('errorMsg');
    const btn = document.getElementById('lookupBtn');
    if (code.length < 4) { errEl.textContent = 'Please enter a 4-character code.'; errEl.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Looking up...'; errEl.style.display = 'none';
    try {
      const snap = await getDoc(doc(db, 'orders', code));
      if (!snap.exists()) {
        errEl.textContent = 'Code not found — double-check with the cashier.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Look up order'; return;
      }
      currentCode = code; currentOrder = snap.data();

      if (currentOrder.status === 'paid' && !currentOrder.cashPaid) {
        showSuccess('✅', 'Already paid!', 'This order has already been paid. Enjoy your lemonade! 🍋');
        return;
      }

      let linesHtml = '';
      Object.values(currentOrder.items).forEach(item => {
        linesHtml += `<div class="order-row"><span>${item.emoji} ${item.name} ×${item.qty}</span><span>$${(item.price * item.qty).toFixed(2)}</span></div>`;
      });
      document.getElementById('orderLines').innerHTML = linesHtml;
      document.getElementById('orderTotal').textContent = '$' + currentOrder.total.toFixed(2);

      const banner = document.getElementById('paymentBanner');
      const btnWrap = document.getElementById('payBtnWrap');
      const total = currentOrder.total.toFixed(2);

      if (currentOrder.cashPaid) {
        banner.className = 'payment-banner banner-cash';
        banner.innerHTML = '✅ Cash already paid — you\'re all set!';
        btnWrap.innerHTML = '';
      } else if (currentOrder.payment === 'venmo') {
        banner.className = 'payment-banner banner-venmo';
        banner.innerHTML = '💙 Pay with Venmo';
        btnWrap.innerHTML = `<button class="pay-btn pay-btn-venmo" onclick="window.handlePay('venmo')">Open Venmo — $${total}</button>`;
      } else {
        banner.className = 'payment-banner banner-apple';
        banner.innerHTML = '🍎 Pay with Apple Pay';
        btnWrap.innerHTML = `<button class="pay-btn pay-btn-apple" onclick="window.handlePay('apple')">Pay $${total}</button>`;
      }

      document.getElementById('lookupView').style.display = 'none';
      document.getElementById('orderView').style.display = 'block';
      btn.disabled = false; btn.textContent = 'Look up order';
    } catch (e) {
      errEl.textContent = 'Something went wrong. Check your connection and try again.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Look up order';
      console.error(e);
    }
  };

  window.handlePay = async (method) => {
    const amount = currentOrder.total.toFixed(2);
    try { await updateDoc(doc(db, 'orders', currentCode), { status: 'paid' }); } catch (e) { console.error(e); }
    if (method === 'venmo') {
      window.location.href = `https://venmo.com/Christian_Schrader?txn=pay&amount=${amount}&note=C%26N%20Lemonade%20Order%20${currentCode}`;
      showSuccess('💙', 'Venmo opened!', 'Please complete the payment in the Venmo app. Enjoy your lemonade! 🍋');
    } else {
      showSuccess('🍎', 'Payment confirmed!', 'Apple Pay went through. Enjoy your lemonade! 🍋');
    }
  };

  function showSuccess(emoji, title, msg) {
    document.getElementById('successEmoji').textContent = emoji;
    document.getElementById('successTitle').textContent = title;
    document.getElementById('successMsg').textContent = msg;
    document.getElementById('lookupView').style.display = 'none';
    document.getElementById('orderView').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
  }

  window.resetCustomer = () => {
    currentCode = null; currentOrder = null;
    document.getElementById('codeInput').value = '';
    document.getElementById('lookupBtn').disabled = false;
    document.getElementById('lookupBtn').textContent = 'Look up order';
    document.getElementById('lookupView').style.display = 'block';
    document.getElementById('orderView').style.display = 'none';
    document.getElementById('successView').style.display = 'none';
  };

  document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') window.lookupCode(); });

  // Auto-load if ?code= is in the URL (from QR scan)
  const urlParams = new URLSearchParams(window.location.search);
  const urlCode = urlParams.get('code');
  if (urlCode && urlCode.length === 4) {
    document.getElementById('codeInput').value = urlCode.toUpperCase();
    window.lookupCode();
  }
</script>
</body>
</html>
